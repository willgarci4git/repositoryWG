name: Trade Hunter — Intraday

on:
  schedule:
    # A cada 15 min, 13h-20h UTC = 10h-17h BRT (BRT = UTC-3, sem horário de
    # verão desde 2019). O watch.py também filtra dia útil/horário por conta
    # própria (via TZ abaixo), então mesmo um disparo fora de hora não faz
    # nada — dupla proteção.
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    # Precisa de write pra commitar trade-hunter/cotacoes_atuais.md (passo
    # "Publicar cotações ao vivo" abaixo) — usa o GITHUB_TOKEN nativo das
    # Actions, sem precisar de PAT nem do GitHub App da rotina semanal.
    permissions:
      contents: write
    env:
      # Crítico: sem isso, datetime.now() no watch.py usa UTC do runner,
      # e a checagem de "horário de pregão" (10h-17h) ficaria toda errada.
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 python-dotenv

      - name: Garantir que a pasta de estado existe
        # Fora do horário de pregão o watch.py sai cedo sem criar data/, o
        # que faria o passo de "salvar cache" falhar (path inexistente) em
        # praticamente toda execução fora das 10h-17h. Criando aqui evita
        # esse falso alarme.
        run: mkdir -p trade-hunter/data

      - name: Restaurar estado (data/) da execução anterior
        uses: actions/cache/restore@v4
        with:
          path: trade-hunter/data
          key: th-intraday-state-${{ github.run_id }}
          restore-keys: |
            th-intraday-state-

      - name: Rodar checagem intraday
        working-directory: trade-hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watch.py --mode intraday

      - name: Publicar cotações ao vivo (se mudou)
        # trade-hunter/cotacoes_atuais.md é reescrito a cada execução (ver
        # build_live_quotes_snapshot() em watch.py) — pedido do usuário pra
        # servir de fonte de dado pro agente financeiro dele num Project do
        # claude.ai, que só alcança URL pública (não roda o server.py MCP
        # local). Só commita se o conteúdo realmente mudou.
        if: always()
        run: |
          cd trade-hunter
          if [ -n "$(git status --porcelain cotacoes_atuais.md)" ]; then
            git config user.name "Trade Hunter bot"
            git config user.email "actions@github.com"
            git add cotacoes_atuais.md
            git commit -m "cotações ao vivo: $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            git push
          else
            echo "Sem mudança nas cotações, nada a commitar."
          fi

      - name: Salvar estado atualizado (sempre, mesmo se o passo acima falhar)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trade-hunter/data
          key: th-intraday-state-${{ github.run_id }}

      - name: Avisar se a rotina quebrou
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Trade Hunter (GitHub Actions - intraday) falhou. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
